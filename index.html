<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WolandIDE</title>
  <meta name="description" content="Télécharger WolandIDE pour Mac.">
  <meta name="theme-color" content="#19191b">
  <link rel="icon" href="favicon.png?v=2">
  <style>
    :root { --bg: #19191b; --lime: #c6f07a; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif; color: #ededed;
      background: var(--bg); overflow: hidden;
      display: grid; grid-template-rows: 1fr auto; padding: 4vh 16px 6vh;
    }
    /* The page is the face. */
    .face { position: relative; min-height: 0; animation: pop .9s cubic-bezier(.2, 1.5, .4, 1) both; }
    .icon { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; animation: bob 6s ease-in-out .9s infinite; }
    .icon * { transform-box: fill-box; transform-origin: center; }
    .icon .brow, .icon .eye { transition: transform .4s cubic-bezier(.2, 1.6, .4, 1); }
    .icon.blink .lid { animation: blink .18s ease-in-out; }
    .icon .pupil { transition: transform .12s ease-out; }
    body.eager .icon { animation-play-state: paused; }
    .icon .brows { transition: transform .25s ease-out; }
    /* Idle expressions, picked at random every few seconds. */
    .icon[data-mood="curious"] .brow-r { transform: translateY(-10px) rotate(-5deg); }
    .icon[data-mood="curious"] .brow-l { transform: translateY(3px) rotate(2deg); }
    .icon[data-mood="doubt"] .brow-l { transform: translateY(-9px) rotate(-7deg); }
    .icon[data-mood="doubt"] .brow-r { transform: translateY(5px) rotate(5deg); }
    .icon[data-mood="focus"] .brow-l { transform: translateY(6px) rotate(6deg); }
    .icon[data-mood="focus"] .brow-r { transform: translateY(7px) rotate(-6deg); }
    .icon[data-mood="wow"] .brow-l { transform: translateY(-12px); }
    .icon[data-mood="wow"] .brow-r { transform: translateY(-12px); }
    .icon[data-mood="wiggle"] .brow-r { animation: wiggle .7s ease-in-out; }
    @keyframes wiggle { 25% { transform: translateY(-9px) rotate(-4deg); } 50% { transform: translateY(0); } 75% { transform: translateY(-9px) rotate(-4deg); } }
    /* The charmer: both brows up-down twice, quick, with a knowing squint. */
    .icon[data-mood="charm"] .brow { animation: charm .9s cubic-bezier(.3, 1.4, .5, 1); }
    .icon[data-mood="charm"] .eye-g { transform: scaleY(.82); }
    @keyframes charm { 0%, 50%, 100% { transform: none; } 18%, 68% { transform: translateY(-16px); } }
    body.eager .icon .brow-l { transform: translateY(-14px) rotate(-6deg); }
    body.eager .icon .brow-r { transform: translateY(-12px) rotate(4deg); }
    body.eager .icon .eye-g { transform: scale(1.1); }
    .icon.jump { animation: jump .6s cubic-bezier(.2, 1.4, .4, 1); }
    footer { isolation: isolate; display: flex; flex-direction: column; align-items: center; gap: 22px; }
    h1 { font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
    /* The download button is the mouth: a lopsided smirk curling up on the right (drawn by .lips). */
    .dl {
      position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      width: min(480px, 82vw); height: 120px; padding: 18px 40px 0 10px;
      color: #111; font-weight: 650; text-decoration: none;
      transform: rotate(-4deg); transition: transform .35s cubic-bezier(.2, 1.5, .4, 1);
    }
    .dl .lips { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .dl:hover { transform: rotate(-7deg) scale(1.05); }
    @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-1.5%) rotate(-1deg); } }
    @keyframes blink { 50% { transform: scaleY(.08); } }
    @keyframes jump { 0% { transform: none; } 35% { transform: translateY(-4%) rotate(3deg) scale(1.02); } 70% { transform: translateY(.5%) scaleY(.98); } 100% { transform: none; } }
    @media (prefers-reduced-motion: reduce) { .face, .icon, .icon * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="face">
    <svg class="icon" viewBox="30 40 205 180" preserveAspectRatio="xMidYMid meet" role="img" aria-label="WolandIDE">
      <g class="brows" stroke="#ededed" stroke-width="14" stroke-linecap="round">
        <line class="brow brow-l" x1="52" y1="102" x2="120" y2="109"/>
        <line class="brow brow-r" x1="145" y1="85" x2="210" y2="62"/>
      </g>
      <g class="lid"><circle cx="87" cy="161" r="30" fill="#050505" stroke="#4a4a50" stroke-width="7"/></g>
      <g class="lid"><g class="eye eye-g"><circle class="iris" cx="176" cy="159" r="38" fill="#c6f07a"/><circle class="pupil" cx="186" cy="148" r="11.5" fill="#050505"/></g></g>
    </svg>
  </div>

  <footer>
    <a class="dl" aria-label="Télécharger pour Mac" href="https://github.com/paul-metz/wolandide-site/releases/latest/download/WolandIDE-mac.dmg">
      <svg class="lips" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true">
        <path fill="#c6f07a" d="M10 26 C110 42 250 40 352 12 C366 8 378 1 388 0 C400 -1 400 14 388 28 C300 116 130 128 22 74 C2 64 0 29 10 26 Z"/>
        <path id="smile" fill="none" d="M34 58 C120 84 250 80 352 34"/>
        <text font-size="25" font-weight="700" fill="#111" letter-spacing=".5"><textPath href="#smile" startOffset="50%" text-anchor="middle" textLength="315" lengthAdjust="spacingAndGlyphs">Télécharger pour Mac</textPath></text>
      </svg>
    </a>
    <h1>WolandIDE</h1>
  </footer>

  <script>
    // The face: blinks now and then, its green eye follows the cursor, raises its brows at the button.
    (() => {
      const face = document.querySelector('.icon'), pupil = face.querySelector('.pupil'), iris = face.querySelector('.iris'), dl = document.querySelector('.dl')
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return
      const blink = () => { face.classList.remove('blink'); void face.getBoundingClientRect(); face.classList.add('blink'); setTimeout(blink, 2200 + Math.random() * 3800) }
      setTimeout(blink, 1400)
      const brows = face.querySelector('.brows'), moods = ['charm', 'charm', 'curious', 'doubt', 'focus', 'wow', 'wiggle']
      let first = true // the very first expression: the charmer
      const mood = () => {
        if (!document.body.classList.contains('eager')) face.dataset.mood = first ? 'charm' : moods[Math.floor(Math.random() * moods.length)]
        first = false
        setTimeout(() => { face.dataset.mood = '' }, 900 + Math.random() * 1400)
        setTimeout(mood, 2600 + Math.random() * 3200)
      }
      setTimeout(mood, 2000)
      addEventListener('pointermove', (e) => {
        const r = iris.getBoundingClientRect()
        const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2)
        const d = Math.hypot(dx, dy) || 1, m = Math.min(1, d / r.width) * 20
        // Rest position sits up-right of the centre; move it toward the cursor, kept inside the green eye (SVG units).
        pupil.style.transform = `translate(${(dx / d) * m - 10}px, ${(dy / d) * m + 11}px)`
        // The brows follow the gaze a little: up when looking up.
        brows.style.transform = `translateY(${Math.max(-1, Math.min(1, dy / innerHeight * 2)) * 5}px)`
      })
      dl.addEventListener('pointerenter', () => { face.dataset.mood = ''; document.body.classList.add('eager') })
      dl.addEventListener('pointerleave', () => document.body.classList.remove('eager'))
      const jump = () => { face.classList.remove('jump'); void face.getBoundingClientRect(); face.classList.add('jump') }
      face.addEventListener('animationend', (e) => { if (e.animationName === 'jump') face.classList.remove('jump') })
      face.addEventListener('click', jump)
      dl.addEventListener('click', jump)
    })()
  </script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WolandIDE</title>
  <meta name="description" content="Télécharger WolandIDE pour Mac.">
  <link rel="icon" href="favicon.png">
  <style>
    :root { --ink: #f7ecd6; --ink-2: rgba(247, 236, 214, .72); --faint: rgba(247, 236, 214, .5); }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif; color: var(--ink);
      /* The logo's sky: deep space, a white-gold core, golden wisps, teal mist at the foot, a few stars. */
      background:
        radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.9), transparent 60%),
        radial-gradient(1px 1px at 27% 9%, rgba(255,240,210,.8), transparent 60%),
        radial-gradient(1.5px 1.5px at 71% 14%, rgba(255,255,255,.9), transparent 60%),
        radial-gradient(1px 1px at 86% 27%, rgba(255,230,190,.8), transparent 60%),
        radial-gradient(1px 1px at 8% 46%, rgba(255,255,255,.6), transparent 60%),
        radial-gradient(1.5px 1.5px at 93% 52%, rgba(255,220,160,.85), transparent 60%),
        radial-gradient(1px 1px at 38% 31%, rgba(255,255,255,.5), transparent 60%),
        radial-gradient(1px 1px at 62% 64%, rgba(255,255,255,.45), transparent 60%),
        radial-gradient(circle at 50% 38%, rgba(255, 246, 215, .55) 0, rgba(245, 210, 110, .32) 14%, rgba(205, 140, 40, .16) 30%, transparent 48%),
        radial-gradient(ellipse 40% 34% at 32% 30%, rgba(210, 150, 50, .22), transparent 70%),
        radial-gradient(ellipse 34% 40% at 72% 48%, rgba(200, 120, 40, .2), transparent 70%),
        radial-gradient(ellipse 30% 30% at 12% 60%, rgba(150, 60, 90, .18), transparent 70%),
        radial-gradient(ellipse 75% 32% at 20% 104%, rgba(40, 140, 140, .55), transparent 72%),
        radial-gradient(ellipse 75% 30% at 85% 102%, rgba(30, 120, 125, .5), transparent 72%),
        linear-gradient(180deg, #160e0b 0%, #1a120f 55%, #0b1d20 100%) fixed;
      background-color: #160e0b;
      display: grid; place-items: center; padding: 24px 16px;
    }
    main { width: min(440px, 100%); text-align: center; }
    .icon { width: 128px; height: 128px; filter: drop-shadow(0 18px 40px rgba(240, 180, 70, .35)); }
    h1 { margin-top: 18px; font-size: 34px; font-weight: 650; letter-spacing: -.02em; }
    .dl {
      display: inline-flex; align-items: center; gap: 10px; margin-top: 28px; padding: 13px 24px; border-radius: 999px;
      background: #f7ecd6; color: #1d1410; font-weight: 600; text-decoration: none; transition: transform .2s cubic-bezier(.2, 1.3, .4, 1);
    }
    .dl:hover { transform: translateY(-1px) scale(1.02); }
    .dl svg { width: 18px; height: 18px; }
    .meta { margin-top: 10px; font-size: 12.5px; color: var(--faint); }
    .step { margin-top: 32px; font-size: 13.5px; color: var(--ink-2); }
    .step b { color: var(--ink); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="icon.png" alt="" width="128" height="128">
    <h1>WolandIDE</h1>

    <a class="dl" href="https://github.com/paul-metz/wolandide-site/releases/latest/download/WolandIDE-mac.dmg">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5V11M4.5 7.5 8 11l3.5-3.5M2.5 13.5h11"/></svg>
      Télécharger pour Mac
    </a>
    <p class="meta">macOS · puces Apple (M1 et plus récentes) · version 0.1.0</p>

    <p class="step">Ouvre le fichier téléchargé et glisse <b>WolandIDE</b> dans <b>Applications</b>.</p>
  </main>
</body>
</html>
